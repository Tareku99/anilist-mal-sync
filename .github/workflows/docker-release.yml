name: Docker Release
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Beta • {0}', github.ref_name) || github.event_name == 'pull_request' && format('PR #{0} • {1}', github.event.number, github.head_ref) || format('Production • {0}', github.ref_name) }}"

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && 'beta') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Check out application source
        id: source
        uses: Tareku99/.github/.github/actions/checkout-source@f2fcda8ad45bc154323d5e247eb680977953e576

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        id: test
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Add test summary
        if: always()
        uses: Tareku99/.github/.github/actions/ci-summary@f2fcda8ad45bc154323d5e247eb680977953e576
        with:
          test-outcome: ${{ steps.test.outcome }}
          source-sha: ${{ steps.source.outputs.source-sha }}
          source-ref: ${{ github.head_ref || github.ref_name }}
          junit: test-results.xml

  build:
    name: build
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Tareku99/.github/.github/workflows/docker-build.yml@f2fcda8ad45bc154323d5e247eb680977953e576
    with:
      image: ghcr.io/tareku99/anilist-mal-sync
      source_image: local-build:ci-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    name: publish
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: Tareku99/.github/.github/workflows/docker-publish.yml@f2fcda8ad45bc154323d5e247eb680977953e576
    with:
      image: ghcr.io/tareku99/anilist-mal-sync
      source_image: local-build:ci-${{ github.run_id }}-${{ github.run_attempt }}
      source_sha: ${{ needs.test.outputs.source_sha }}
      include_sha_tag: true
    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  version-tag:
    needs: [test, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    uses: Tareku99/.github/.github/workflows/docker-version-tag.yml@f2fcda8ad45bc154323d5e247eb680977953e576
    with:
      image: ghcr.io/tareku99/anilist-mal-sync
      image_digest: ${{ needs.publish.outputs.digest }}
      source_sha: ${{ needs.test.outputs.source_sha }}
      version_file: pyproject.toml
      version_key: project.version

  summary:
    name: Workflow summary
    needs: [test, build, publish, version-tag]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Report workflow results
        uses: Tareku99/.github/.github/actions/ci-summary@f2fcda8ad45bc154323d5e247eb680977953e576
        with:
          jobs: ${{ toJSON(needs) }}
          source-sha: ${{ needs.test.outputs.source_sha }}
          source-ref: ${{ github.head_ref || github.ref_name }}
          channel: ${{ github.event_name == 'pull_request' && 'CI' || github.event_name == 'workflow_dispatch' && 'Beta' || 'Production' }}
          image: ghcr.io/tareku99/anilist-mal-sync
