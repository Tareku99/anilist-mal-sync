name: Docker Release
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Beta • {0}', inputs.branch) || github.event_name == 'pull_request' && format('PR #{0} • {1}', github.event.number, github.head_ref) || format('Production • {0}', github.ref_name) }}"

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish as beta (run this workflow from main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && 'beta') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Check out application source
        id: source
        uses: Tareku99/.github/.github/actions/checkout-source@9b06ea2f760ae88d61a247d2104851fcc44536bd
        with:
          branch: ${{ inputs.branch || '' }}
          default-branch: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        id: test
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Add test summary
        if: always()
        uses: Tareku99/.github/.github/actions/ci-summary@04dd88f13b5c0b4a07d66ddd6da00522509abb52
        with:
          test-outcome: ${{ steps.test.outcome }}
          source-sha: ${{ steps.source.outputs.source-sha }}
          source-ref: ${{ inputs.branch || github.head_ref || github.ref_name }}
          junit: test-results.xml

  build:
    name: build
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Tareku99/.github/.github/workflows/docker-build.yml@1a6c2853f568baecbb6d099f9f0860c670ad7109
    with:
      image: ghcr.io/tareku99/anilist-mal-sync
      source_image: local-build:ci-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    name: publish
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: Tareku99/.github/.github/workflows/docker-publish.yml@1a6c2853f568baecbb6d099f9f0860c670ad7109
    with:
      image: ghcr.io/tareku99/anilist-mal-sync
      source_image: local-build:ci-${{ github.run_id }}-${{ github.run_attempt }}
      source_sha: ${{ needs.test.outputs.source_sha }}
      beta_branch: ${{ inputs.branch || '' }}
      include_sha_tag: true
    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Workflow summary
    needs: [test, build, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Report workflow results
        uses: Tareku99/.github/.github/actions/ci-summary@04dd88f13b5c0b4a07d66ddd6da00522509abb52
        with:
          jobs: ${{ toJSON(needs) }}
          source-sha: ${{ needs.test.outputs.source_sha }}
          source-ref: ${{ inputs.branch || github.head_ref || github.ref_name }}
          channel: ${{ github.event_name == 'pull_request' && 'CI' || github.event_name == 'workflow_dispatch' && 'Beta' || 'Production' }}
          image: ghcr.io/tareku99/anilist-mal-sync
