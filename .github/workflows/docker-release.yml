name: Docker Release
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Beta • {0}', inputs.branch) || github.event_name == 'pull_request' && format('PR #{0} • {1}', github.event.number, github.head_ref) || format('Production • {0}', github.ref_name) }}"

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish as beta (run this workflow from main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && 'beta') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate beta branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BETA_BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch and enter the beta branch as an input."
            exit 1
          fi
          git check-ref-format "refs/heads/$BETA_BRANCH"

      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/heads/{0}', inputs.branch) || github.sha }}
          persist-credentials: false

      - name: Record source commit
        id: source
        shell: bash
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        id: test
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Add test summary
        if: always()
        uses: Tareku99/.github/.github/actions/ci-summary@cd06ab688b1092a2018b9de3cee09226daa3a204
        with:
          test-outcome: ${{ steps.test.outcome }}
          source-sha: ${{ steps.source.outputs.sha }}
          source-ref: ${{ inputs.branch || github.head_ref || github.ref_name }}
          junit: test-results.xml


  build:
    name: build
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Tareku99/.github/.github/workflows/docker-build.yml@cd06ab688b1092a2018b9de3cee09226daa3a204
    with:
      image: ghcr.io/tareku99/anilist-mal-sync
      source_image: local-build:ci-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    name: publish
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: Tareku99/.github/.github/workflows/docker-publish.yml@cd06ab688b1092a2018b9de3cee09226daa3a204
    with:
      image: ghcr.io/tareku99/anilist-mal-sync
      source_image: local-build:ci-${{ github.run_id }}-${{ github.run_attempt }}
      source_sha: ${{ needs.test.outputs.source_sha }}
      beta_branch: ${{ inputs.branch || '' }}
      include_sha_tag: true
    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Workflow summary
    needs: [test, build, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Report workflow results
        uses: Tareku99/.github/.github/actions/ci-summary@cd06ab688b1092a2018b9de3cee09226daa3a204
        with:
          jobs: ${{ toJSON(needs) }}
          source-sha: ${{ needs.test.outputs.source_sha }}
          source-ref: ${{ inputs.branch || github.head_ref || github.ref_name }}
          channel: ${{ github.event_name == 'pull_request' && 'CI' || github.event_name == 'workflow_dispatch' && 'Beta' || 'Production' }}
          image: ghcr.io/tareku99/anilist-mal-sync
