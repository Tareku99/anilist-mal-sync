name: Docker Release
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} • {1}', github.event.number, github.head_ref) || format('{0} • {1}', github.event_name, github.ref_name) }}"

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        id: test
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Add test summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          counts = {}
          try:
              root = ET.parse("test-results.xml").getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              for key in ("tests", "failures", "errors", "skipped"):
                  counts[key] = sum(int(suite.get(key, "0")) for suite in suites)
              counts["passed"] = (
                  counts["tests"] - counts["failures"] - counts["errors"] - counts["skipped"]
              )
          except (OSError, ET.ParseError):
              pass

          outcome = os.environ.get("TEST_OUTCOME", "not run")
          result = {
              "success": "✅ Passed",
              "failure": "❌ Failed",
              "cancelled": "⚪ Cancelled",
              "skipped": "⏭️ Skipped",
          }.get(outcome, "⚪ Not run")
          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ["GITHUB_SERVER_URL"]
          sha = os.environ["GITHUB_SHA"]
          ref = os.environ.get("HEAD_REF") or os.environ["GITHUB_REF_NAME"]
          rows = [
              "## Test results",
              "",
              "| Item | Result |",
              "| --- | --- |",
              f"| Test suite | {result} |",
              f"| Total tests | {counts.get('tests', 'Unavailable')} |",
              f"| Passed | {counts.get('passed', 'Unavailable')} |",
              f"| Failed | {counts.get('failures', 'Unavailable')} |",
              f"| Errors | {counts.get('errors', 'Unavailable')} |",
              f"| Skipped | {counts.get('skipped', 'Unavailable')} |",
              "| Python | 3.11 |",
              f"| Trigger | {os.environ['GITHUB_EVENT_NAME']} |",
              f"| Ref | {ref} |",
              f"| Commit | [`{sha[:7]}`]({server}/{repo}/commit/{sha}) |",
              "",
              "Production images publish after tests on pushes to `main` or version tags. A manual run publishes the selected branch as `beta`.",
              "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(rows))
          PY

  build:
    name: build
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Tareku99/shared-devops/.github/workflows/docker-build.yml@6a608704827d1d8a3596811b7f8c0e79b5d7c71c
    with:
      image: ghcr.io/tareku99/anilist-mal-sync
      source_image: anilist-mal-sync:ci-${{ github.run_id }}-${{ github.run_attempt }}

  prepare-tags:
    name: prepare-tags
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag_list="$(printf 'beta\nbeta-%s' "${GITHUB_SHA:0:12}")"
          else
            {
              if [[ "$GITHUB_REF" == refs/heads/main ]]; then
                printf '%s\n' latest
                printf '%s\n' main
              else
                printf '%s\n' latest
                printf '%s\n' "$GITHUB_REF_NAME"
              fi
              printf 'sha-%s\n' "${GITHUB_SHA:0:7}"
            } | awk 'NF && !seen[$0]++' > "$RUNNER_TEMP/anilist-image-tags.txt"
            tag_list="$(cat "$RUNNER_TEMP/anilist-image-tags.txt")"
          fi
          delimiter="ANILIST_TAGS_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'tags<<%s\n' "$delimiter"
            printf '%s\n' "$tag_list"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: [test, prepare-tags]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: Tareku99/shared-devops/.github/workflows/docker-publish.yml@6a608704827d1d8a3596811b7f8c0e79b5d7c71c
    with:
      image: ghcr.io/tareku99/anilist-mal-sync
      source_image: anilist-mal-sync:ci-${{ github.run_id }}-${{ github.run_attempt }}
      tags: ${{ needs.prepare-tags.outputs.tags }}
    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}
