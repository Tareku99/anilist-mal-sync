name: Test and Publish Docker Image
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} • {1}', github.event.number, github.head_ref) || format('{0} • {1}', github.event_name, github.ref_name) }}"

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to create (e.g., v1.0.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        id: test
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Add test summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          counts = {}
          try:
              root = ET.parse("test-results.xml").getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              for key in ("tests", "failures", "errors", "skipped"):
                  counts[key] = sum(int(suite.get(key, "0")) for suite in suites)
              counts["passed"] = (
                  counts["tests"] - counts["failures"] - counts["errors"] - counts["skipped"]
              )
          except (OSError, ET.ParseError):
              pass

          outcome = os.environ.get("TEST_OUTCOME", "not run")
          result = {
              "success": "✅ Passed",
              "failure": "❌ Failed",
              "cancelled": "⚪ Cancelled",
              "skipped": "⏭️ Skipped",
          }.get(outcome, "⚪ Not run")
          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ["GITHUB_SERVER_URL"]
          sha = os.environ["GITHUB_SHA"]
          ref = os.environ.get("HEAD_REF") or os.environ["GITHUB_REF_NAME"]
          rows = [
              "## Test results",
              "",
              "| Item | Result |",
              "| --- | --- |",
              f"| Test suite | {result} |",
              f"| Total tests | {counts.get('tests', 'Unavailable')} |",
              f"| Passed | {counts.get('passed', 'Unavailable')} |",
              f"| Failed | {counts.get('failures', 'Unavailable')} |",
              f"| Errors | {counts.get('errors', 'Unavailable')} |",
              f"| Skipped | {counts.get('skipped', 'Unavailable')} |",
              f"| Python | 3.11 |",
              f"| Trigger | {os.environ['GITHUB_EVENT_NAME']} |",
              f"| Ref | {ref} |",
              f"| Commit | [`{sha[:7]}`]({server}/{repo}/commit/{sha}) |",
              "",
              "The Docker image is published only after this test job succeeds, on pushes to `main` or a manual workflow run.",
              "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(rows))
          PY

  build:
    name: build
    needs: tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image for PR validation
        uses: Tareku99/shared-devops/.github/actions/docker-release@3cc3ffbd30f55a40dfcf812ff2d378b4913d5180
        with:
          image: ghcr.io/tareku99/anilist-mal-sync
          source_image: anilist-mal-sync:ci-${{ github.run_id }}-${{ github.run_attempt }}

  build-and-push:
    name: Build and push GHCR image
    needs: tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_file="$RUNNER_TEMP/anilist-image-tags.txt"
          {
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              printf '%s\n' latest
            fi
            if [[ "$GITHUB_REF" == refs/heads/* ]]; then
              branch="${GITHUB_REF#refs/heads/}"
              branch="$(printf '%s' "$branch" | sed -E 's/[^A-Za-z0-9_.-]+/-/g')"
              printf '%s\n' "$branch"
            fi
            if [[ -n "$INPUT_TAG" ]]; then
              printf '%s\n' "$INPUT_TAG"
            fi
            printf 'sha-%s\n' "${GITHUB_SHA:0:7}"
          } | awk 'NF && !seen[$0]++' > "$tag_file"
          delimiter="ANILIST_TAGS_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'tags<<%s\n' "$delimiter"
            cat "$tag_file"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish tested image
        id: build
        uses: Tareku99/shared-devops/.github/actions/docker-release@3cc3ffbd30f55a40dfcf812ff2d378b4913d5180
        with:
          image: ghcr.io/tareku99/anilist-mal-sync
          source_image: anilist-mal-sync:ci-${{ github.run_id }}-${{ github.run_attempt }}
          publish: "true"
          tags: ${{ steps.meta.outputs.tags }}
          token: ${{ secrets.GITHUB_TOKEN }}
